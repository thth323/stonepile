    readyIndicator.classList.remove('show');
    e.preventDefault();
  }

  function handleThrowCancel() {
    // Release any stone being dragged via touch
    if (touchStone) {
      Body.setStatic(touchStone.body, false);
      Body.setVelocity(touchStone.body, { x: 0, y: 0 });
      touchStone = null;
      touchStartPos = null;
      touchLastPos = null;
    }
    throwOrigin = null;
    throwCurrent = null;
  }

  function doThrow(text) {
    if (!text.trim()) return;
    pendingThrow = text.trim();
    readyIndicator.classList.add('show');
  }

  throwBtn.addEventListener('click', () => {
    const text = inputEl.value.trim();
    if (!text) return;
    doThrow(text);
  });

  inputEl.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') {
      const text = inputEl.value.trim();
      if (!text) return;
      doThrow(text);
    }
  });

  canvas.addEventListener('mousedown', handleThrowStart);
  canvas.addEventListener('mouseup', handleThrowEnd);
  canvas.addEventListener('touchstart', handleThrowStart, { passive: false });
  canvas.addEventListener('touchend', handleThrowEnd, { passive: false });
  canvas.addEventListener('touchcancel', handleThrowCancel);

  // ── Content Panels (floating reading surfaces with physics) ──
  let panels = [];

  // Browser back-button guard. Strategy: when overlays are open, push a
  // history state so the back button pops it. In popstate we check whether
  // ANY overlay is currently open (not the state object) because e.state is
  // the *target* entry, not the one we left. If overlays are open we close
  // them and re-push a guard state so the browser stays on the page.
  // Only when overlays are already closed do we let the browser leave.
  function pushOverlayState() {
    history.pushState({ spOverlay: true }, '');
  }
  function closeAllOverlays() {
    while (panels.length > 0) removePanel(panels[panels.length - 1]);
    if (commonsPanel && commonsPanel.classList.contains('open')) commonsPanel.classList.remove('open');
    if (clearToast) clearToast.classList.remove('show');
    if (statsOverlay) statsOverlay.classList.remove('open');
  }
  function hasOpenOverlay() {
    return panels.length > 0 ||
      (commonsPanel && commonsPanel.classList.contains('open')) ||
      (clearToast && clearToast.classList.contains('show')) ||
      (statsOverlay && statsOverlay.classList.contains('open'));
  }

  // ── Physical strata: buried stones can't be read ──
  // Matter.js naturally piles stones. A stone hidden beneath others
  // is "buried" — you must move the stones above it to read it.
  // This is not a rule we enforce; it's a consequence of physics.
  // Returns the stone or rubble that is blocking this stone, or null if visible.
  function getBlockingStone(stone) {
    const sbody = stone.body;
    const sx = sbody.position.x;
    const sy = sbody.position.y;
    const sr = stone.radius || 25;

    // Check real stones — find the one directly above (smallest dy that still blocks)
    let best = null, bestDy = Infinity;
    for (const s of stones) {
      if (s === stone) continue;
      const dy = sy - s.body.position.y;
      if (dy > sr * 0.6 && Math.abs(s.body.position.x - sx) < s.radius + sr - 4) {
        if (dy < bestDy) { bestDy = dy; best = s; }
      }
    }
    if (best) return best;

    // Check rubble too
    for (const r of rubble) {
      if (r === stone) continue;
      const rr = r.radius || 18;
      const dy = sy - r.body.position.y;
      if (dy > sr * 0.5 && Math.abs(r.body.position.x - sx) < rr + sr - 2) {
        return r;
      }
    }
    return null;
  }
  function isStoneBuried(stone) { return !!getBlockingStone(stone); }

  function openContentPanel(stone) {
    closePanelForStone(stone);

    // Buried stones — you can see the stone but can't open it.
    // The panel appears briefly as a whisper: "it's under there."
    const blocker = getBlockingStone(stone);
    if (!stone.isEmpty && stone.text && blocker) {
      // Highlight the blocker so the user knows which one to drag
      blocker._blockerGlow = Date.now() + 2500;
      stone._buriedBump = Date.now() + 800;

      const panel = document.createElement('div');
      panel.className = 'content-panel light';
      panel.style.opacity = '0';
      panel.innerHTML = `<div class="panel-close">×</div><div class="panel-body" style="color:#8a7060;text-align:center;padding:24px 0;font-size:15px;letter-spacing:2px;">被埋住了<div style="font-size:11px;opacity:0.5;margin-top:8px;letter-spacing:0;">按住上面的石头拖开</div></div>`;
      document.body.appendChild(panel);
      panel.style.left = (stone.body.position.x - 110) + 'px';
      panel.style.top = (stone.body.position.y - stone.radius - 60) + 'px';
      requestAnimationFrame(() => { panel.style.opacity = '0.7'; panel.classList.add('active'); });
      // Fades quickly — you found an obstacle, not content
      setTimeout(() => {
        panel.style.transition = 'opacity 0.8s ease';
        panel.style.opacity = '0';
        setTimeout(() => panel.remove(), 800);
      }, 2000);
      panel.querySelector('.panel-close').addEventListener('click', (e) => {
        e.stopPropagation();
        panel.remove();
      });
      return;
    }

    // Empty stones — rubble with no text. You cracked open a rock and found
    // only rock. The panel is almost transparent, almost empty, and fades
    // quickly. The silence is the content.
    if (stone.isEmpty || !stone.text) {
      const panel = document.createElement('div');
      panel.className = 'content-panel light';
      panel.style.opacity = '0.4';
      panel.innerHTML = `<div class="panel-close" style="opacity:0.5">×</div>`;
      document.body.appendChild(panel);
      panel.style.left = stone.body.position.x + 'px';
      panel.style.top = (stone.body.position.y - stone.radius - 40) + 'px';
      panel.classList.add('active');
      // Fades away after 2.5s — you found nothing, and nothing doesn't linger
      setTimeout(() => {
        panel.style.transition = 'opacity 1.2s ease';
        panel.style.opacity = '0';
        setTimeout(() => panel.remove(), 1200);
      }, 2500);
      panel.querySelector('.panel-close').addEventListener('click', (e) => {
        e.stopPropagation();
        panel.remove();
      });
      return;
    }

    const panel = document.createElement('div');
    // Visual class based on weight — difference is immediately visible
    const weightClass = stone.weight < 0.7 ? 'light' : stone.weight < 1.4 ? 'medium' : 'heavy';
    panel.className = `content-panel ${weightClass}`;
    const displayText = stone.text.length > 8 ? stone.text.slice(0, 8) + '…' : stone.text;
    const weightLabel = stone.weight < 0.7 ? '轻' : stone.weight < 1.4 ? '适中' : stone.weight < 2.0 ? '沉' : '重';

    panel.innerHTML = `
      <div class="panel-close">×</div>
      <div class="panel-title">「${escapeHtml(displayText)}」</div>
      <div class="panel-body">${escapeHtml(stone.content).replace(/\n/g, '<br>')}</div>
      <div class="weight-hint">分量：${weightLabel}<span class="share-rub offer-stone" title="供出去——它会沉入这里的土地，出现在所有人的石堆里">供</span><span class="share-rub" title="拓下这块石头">拓</span></div>
    `;
    document.body.appendChild(panel);

    // Physics state — dramatic differences between light and heavy
    const isLight = stone.weight < 0.7;
    const isHeavy = stone.weight >= 1.4;
    const p = {
      el: panel,
      stone: stone,
      x: stone.body.position.x,
      y: stone.body.position.y - stone.radius - 60,
      vx: 0, vy: 0,
      dragging: false,
      lastMouseX: 0, lastMouseY: 0,
      // Light: slippery, responsive. Heavy: sluggish, resistant.
      friction: isLight ? 0.94 : isHeavy ? 0.82 : 0.88,
      mass: isLight ? 0.3 : isHeavy ? 3.0 : 1.0,
      // Buoyancy: light floats up, heavy sinks down
      buoyancy: isLight ? -0.04 : isHeavy ? 0.08 : 0.02
    };
    panels.push(p);

    // Show with a small pop — no smooth CSS transition, just physics
    p.el.style.left = p.x + 'px';
    p.el.style.top = (p.y - 20) + 'px';
    requestAnimationFrame(() => {
      p.vy = -1.5; // Initial upward pop
      panel.classList.add('active');
    });

    panel.querySelector('.panel-close').addEventListener('click', (e) => {
      e.stopPropagation();
      removePanel(p);
    });

    // "拓" — make a rubbing of this stone to share (encode into URL, no backend)
    const shareEl = panel.querySelector('.share-rub:not(.offer-stone)');
    shareEl.addEventListener('click', (e) => {
      e.stopPropagation();
      const data = { t: stone.text, c: stone.content, ts: stone.createdAt };
      const encoded = btoa(unescape(encodeURIComponent(JSON.stringify(data))));
      const url = location.origin + location.pathname + '#s=' + encoded;
      const done = () => {
        shareEl.textContent = '已拓';
        setTimeout(() => { shareEl.textContent = '拓'; }, 1600);
        // Whisper: the link is on your clipboard
        const toast = document.createElement('div');
        toast.style.cssText = 'position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:rgba(30,26,22,0.85);color:#C4B8A0;padding:10px 22px;border-radius:6px;font-size:13px;letter-spacing:0.5px;opacity:0;transition:opacity 0.5s;z-index:200;pointer-events:none;white-space:nowrap;';
        toast.textContent = '链接已复制，可粘贴分享给朋友';
        document.body.appendChild(toast);
        requestAnimationFrame(() => { toast.style.opacity = '1'; });
        setTimeout(() => { toast.style.opacity = '0'; setTimeout(() => toast.remove(), 500); }, 2500);
      };
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(url).then(done).catch(() => {
          // Fallback: promptless manual copy
          const ta = document.createElement('textarea');
          ta.value = url; document.body.appendChild(ta); ta.select();
          try { document.execCommand('copy'); } catch (err) {}
          ta.remove(); done();
        });
      } else {
        const ta = document.createElement('textarea');
        ta.value = url; document.body.appendChild(ta); ta.select();
        try { document.execCommand('copy'); } catch (err) {}
        ta.remove(); done();
      }
    });

    // One-time hint: pulse the "拓" button so users know they can share stones
    if (!localStorage.getItem('stonepile-seen-rub')) {
      localStorage.setItem('stonepile-seen-rub', '1');
      shareEl.style.opacity = '0.9';
      shareEl.style.color = '#D4C8B0';
      setTimeout(() => { shareEl.style.opacity = ''; shareEl.style.color = ''; }, 3000);
    }

    // "供" — give this stone to the commons. It sinks here, appears everywhere.
    const offerEl = panel.querySelector('.offer-stone');
    offerEl.addEventListener('click', async (e) => {
      e.stopPropagation();
      const feedback = (text, revert = true) => {
        offerEl.textContent = text;
        if (revert) setTimeout(() => { offerEl.textContent = '供'; }, 1800);
      };
      // A stone must have rested here at least 20h before it may be offered
      if (Date.now() - stone.createdAt < 20 * 3600 * 1000) {
        feedback('太新');
        return;
      }
      offerEl.textContent = '…';
      try {
        const res = await fetch(POOL_API + '/offer', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ t: stone.text, c: stone.content, ts: stone.createdAt, w: stone.weight })
        });
        const data = await res.json().catch(() => ({}));
        if (res.ok && data.ok) {
          feedback('已供', false);
          // It leaves this pile — sinks into the earth, belongs to everyone
          const idx = stones.indexOf(stone);
          if (idx >= 0) {
            stones.splice(idx, 1);
            stoneCount = stones.length;
            updateStoneCount();
            saveStones();
            sinkStone(stone);
            setTimeout(() => removePanel(p), 900);
          }
        } else {
          feedback(data.error === 'too_often' ? '一日一供' : '未成');
        }
      } catch (err) {
        feedback('未成');
      }
    });

    panel.addEventListener('mousedown', (e) => {
      if (e.target.classList.contains('panel-close') || e.target.classList.contains('share-rub')) return;
      p.dragging = true;
      panel.classList.add('dragging');
      p.lastMouseX = e.clientX;
      p.lastMouseY = e.clientY;
    });

    // Touch drag support — panels are draggable on mobile too
    panel.addEventListener('touchstart', (e) => {
      if (e.target.classList.contains('panel-close') || e.target.classList.contains('share-rub')) return;
      if (e.touches.length === 1) {
        p.dragging = true;
        panel.classList.add('dragging');
        p.lastMouseX = e.touches[0].clientX;
        p.lastMouseY = e.touches[0].clientY;
        e.preventDefault();
      }
    }, { passive: false });

    pushOverlayState();
    stone.readAt = Date.now();
    // Reading leaves warmth — the stone remembers being seen
    stone.warmth = Math.min(1, (stone.warmth || 0) + 0.6);
  }

  function removePanel(p) {
    p.el.style.opacity = '0';
    setTimeout(() => {
      if (p.el.parentNode) p.el.remove();
      panels = panels.filter(x => x !== p);
    }, 200);
  }

  function closePanelForStone(stone) {
    for (const p of panels) {
      if (p.stone === stone) removePanel(p);
    }
  }

  function updatePanels() {
    for (const p of panels) {
      if (!p.dragging) {
        // Friction slows movement
        p.vx *= p.friction;
        p.vy *= p.friction;

        // Gravity / buoyancy — heavy sinks, light floats
        p.vy += p.buoyancy;

        // Slight random drift for light panels (like dust)
        if (p.mass < 0.5) {
          p.vx += (Math.random() - 0.5) * 0.03;
          p.vy += (Math.random() - 0.5) * 0.02;
        }

        p.x += p.vx;
        p.y += p.vy;

        // Boundaries with bounce
        const rect = p.el.getBoundingClientRect();
        const w = rect.width || 300;
        const h = rect.height || 150;
        if (p.x - w/2 < 10) { p.x = 10 + w/2; p.vx *= -0.3; }
        if (p.x + w/2 > canvas.width - 10) { p.x = canvas.width - 10 - w/2; p.vx *= -0.3; }
        if (p.y - h < 10) { p.y = 10 + h; p.vy *= -0.2; }
        if (p.y > canvas.height - 10) { p.y = canvas.height - 10; p.vy *= -0.2; }
      }
      p.el.style.left = p.x + 'px';
      p.el.style.top = p.y + 'px';
    }
  }

  function escapeHtml(text) {
    const div = document.createElement('div');
    div.textContent = text;
    return div.innerHTML.replace(/\n/g, '<br>');
  }

  // Panel drag during mousemove (global)
  document.addEventListener('mousemove', (e) => {
    for (const p of panels) {
      if (p.dragging) {
        const dx = e.clientX - p.lastMouseX;
        const dy = e.clientY - p.lastMouseY;
        // Heavier panels need more force to accelerate
        p.vx += dx * 0.15 / p.mass;
        p.vy += dy * 0.15 / p.mass;
        p.x += dx;
        p.y += dy;
        p.lastMouseX = e.clientX;
        p.lastMouseY = e.clientY;
      }
    }
  });
  document.addEventListener('mouseup', () => {
    for (const p of panels) {
      p.dragging = false;
      p.el.classList.remove('dragging');
    }
  });
  // Touch equivalents for panel dragging
  document.addEventListener('touchmove', (e) => {
    for (const p of panels) {
      if (p.dragging && e.touches.length === 1) {
        const dx = e.touches[0].clientX - p.lastMouseX;
        const dy = e.touches[0].clientY - p.lastMouseY;
        p.vx += dx * 0.15 / p.mass;
        p.vy += dy * 0.15 / p.mass;
        p.x += dx;
        p.y += dy;
        p.lastMouseX = e.touches[0].clientX;
        p.lastMouseY = e.touches[0].clientY;
        e.preventDefault();
      }
    }
  }, { passive: false });
  document.addEventListener('touchend', () => {
    for (const p of panels) {
      p.dragging = false;
      p.el.classList.remove('dragging');
    }
  });

  // ── Double-click stone to open content panel ──
  // Checks text stones first (they're drawn on top), then rubble.
  canvas.addEventListener('dblclick', (e) => {
    if (!isActive) return;
    const pos = { x: e.clientX, y: e.clientY };
    // Text stones first — they're on top visually
    for (let i = stones.length - 1; i >= 0; i--) {
      const s = stones[i];
      const b = s.body;
      const dist = Math.sqrt((b.position.x - pos.x) ** 2 + (b.position.y - pos.y) ** 2);
      if (dist < s.radius + 8) {
        openContentPanel(s);
        return;
      }
    }
    // Then rubble — opening an empty stone is part of the experience
    for (let i = rubble.length - 1; i >= 0; i--) {
      const s = rubble[i];
      const b = s.body;
      const dist = Math.sqrt((b.position.x - pos.x) ** 2 + (b.position.y - pos.y) ** 2);
      if (dist < s.radius + 8) {
        openContentPanel(s);
        return;
      }
    }
  });

  // ── Gate ──
  const gateEl = document.getElementById('gate');
  const gateEnter = document.getElementById('gate-enter');
  const gateStatsEl = document.getElementById('gate-stats');
  const gateDustCanvas = document.getElementById('gate-dust');
  const gateDustCtx = gateDustCanvas.getContext('2d');
  gateDustCanvas.width = window.innerWidth;
  gateDustCanvas.height = window.innerHeight;

  // Fetch live stats from the worker and update the gate footer
  const statsOverlay = document.getElementById('stats-overlay');
  const statsBig = document.getElementById('stats-big');
  const statsChart = document.getElementById('stats-chart');
  const statsSubtitle = document.getElementById('stats-subtitle');
  const statsClose = document.getElementById('stats-close');

  let cachedStats = null; // Avoid re-fetching on every open

  async function fetchStats(retries = 2) {
    for (let attempt = 1; attempt <= retries; attempt++) {
      try {
        const ctrl = new AbortController();
        const timer = setTimeout(() => ctrl.abort(), 5000); // 5s timeout
        const res = await fetch(POOL_API + '/stats', { signal: ctrl.signal });
        clearTimeout(timer);
        if (!res.ok) throw new Error('status ' + res.status);
        return await res.json();
      } catch (e) {
        if (attempt === retries) return null;
        await new Promise(r => setTimeout(r, 1000 * attempt)); // backoff: 1s, 2s
      }
    }
    return null;
  }

  async function updateGateStats() {
    const data = await fetchStats();
    if (data) {
      cachedStats = data;
      const dau = data.dau || 0;
      const nowCount = data.dates[0] ? data.dates[0].count : 0;
      let line = '';
      if (nowCount > 0) {
        line = '此刻 ' + nowCount + ' 人在堆旁  ·  ';
      }
      line += '今日 ' + dau + ' 人来过';
      gateStatsEl.textContent = line;
      gateStatsEl.classList.add('has-data');
      gateStatsEl.style.cursor = 'pointer';
      gateStatsEl.title = '点击查看统计';
      return;
    }
    // Fallback: show local stone count so "正在计数..." never hangs forever
    let localCount = 0;
    try {
      const raw = localStorage.getItem('stonepile_v3');
      if (raw) {
        const saved = JSON.parse(raw);
        if (saved && Array.isArray(saved.stones)) localCount = saved.stones.length;
      }
    } catch (e) {}
    gateStatsEl.textContent = (localCount > 0 ? localCount + ' 块石头在此' : '石头等你来摞');
    gateStatsEl.style.cursor = 'default';
    gateStatsEl.title = '';
  }

  function renderStatsOverlay(data) {
    if (!data) return;
    statsSubtitle.textContent = '\u2014 ' + data.dates.length + ' \u65e5 \u2014';
    // Big numbers
    statsBig.innerHTML = '';
    [
      ['\u4eca\u65e5', '\u65e5\u6d3b', data.dau],
      ['\u8fd1 7 \u65e5', '\u5468\u6d3b', data.wau],
      ['\u8fd1 30 \u65e5', '\u6708\u6d3b', data.mau],
    ].forEach(function(card) {
      var el = document.createElement('div');
      el.className = 'stat-card';
      el.innerHTML = '<div class="num">' + (card[2] || 0) + '</div><div class="label">' + card[0] + '</div>';
      statsBig.appendChild(el);
    });

    // Bar chart — show 14 days
    statsChart.innerHTML = '';
    var days = data.dates.slice(0, 14).reverse();
    var maxCount = 1;
    days.forEach(function(d) { if (d.count > maxCount) maxCount = d.count; });
    days.forEach(function(d, i) {
      var wrap = document.createElement('div');
      wrap.className = 'bar-wrap';
      var h = Math.max(2, Math.round((d.count / maxCount) * 92));
      var isToday = i === days.length - 1;
      var label = d.date.slice(5);
      wrap.innerHTML =
        '<div class="bar' + (isToday ? ' today' : '') + '" style="height:' + h + 'px" title="' + d.date + ': ' + d.count + '"></div>' +
        '<div class="bar-label">' + label + '</div>';
      statsChart.appendChild(wrap);
    });
  }

  updateGateStats();

  // Stats panel — debounce double-clicks and concurrent fetches
  let statsLoading = false;
  // Open stats overlay when clicking gate stats
  gateStatsEl.addEventListener('click', async function() {
    if (statsOverlay.classList.contains('open')) return; // already open
    if (statsLoading) return; // in-flight — skip double-tap
    if (!cachedStats) {
      statsLoading = true;
      cachedStats = await fetchStats();
      statsLoading = false;
    }
    if (cachedStats) {
      renderStatsOverlay(cachedStats);
      statsOverlay.classList.add('open');
      pushOverlayState();
    }
  });

  // Close stats overlay
  statsClose.addEventListener('click', function() {
    statsOverlay.classList.remove('open');
  });
  statsOverlay.addEventListener('click', function(e) {
    if (e.target === statsOverlay) statsOverlay.classList.remove('open');
  });
  // Close with Escape key
  document.addEventListener('keydown', function(e) {
    if (e.key === 'Escape' && statsOverlay.classList.contains('open')) {
      statsOverlay.classList.remove('open');
    }
  });

  // Gate "指路" — copy site link, no tracking
  const gateShareEl = document.getElementById('gate-share');
  gateShareEl.addEventListener('click', function() {
    const url = location.origin + location.pathname;
    const done = () => {
      gateShareEl.textContent = '已复制';
      gateShareEl.style.color = '#D4C8B0';
      setTimeout(() => {
        gateShareEl.textContent = '指 路';
        gateShareEl.style.color = '';
      }, 1800);
    };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(url).then(done).catch(() => {
        const ta = document.createElement('textarea');
        ta.value = url; document.body.appendChild(ta); ta.select();
        try { document.execCommand('copy'); } catch (err) {}
        ta.remove(); done();
      });
    } else {
      const ta = document.createElement('textarea');
      ta.value = url; document.body.appendChild(ta); ta.select();
      try { document.execCommand('copy'); } catch (err) {}
      ta.remove(); done();
    }
  });

  // Gate floating dust particles
  const gateDust = [];
  for (let i = 0; i < 50; i++) {
    gateDust.push({
      x: Math.random() * gateDustCanvas.width,
      y: Math.random() * gateDustCanvas.height,
      r: 0.5 + Math.random() * 1.5,
      vx: (Math.random() - 0.5) * 0.12,
      vy: -(0.03 + Math.random() * 0.15),
      opacity: 0.15 + Math.random() * 0.3
    });
  }

  // Gate dust: stops when gate is hidden to avoid wasting CPU in the pile
  let gateDustRafId = 0;
  function animateGateDust() {
    if (!gateEl.classList.contains('hidden')) {
      gateDustCtx.clearRect(0, 0, gateDustCanvas.width, gateDustCanvas.height);
      for (const p of gateDust) {
        p.x += p.vx;
        p.y += p.vy;
        if (p.x < -20) p.x = gateDustCanvas.width + 20;
        if (p.x > gateDustCanvas.width + 20) p.x = -20;
        if (p.y < -20) p.y = gateDustCanvas.height + 20;
        if (p.y > gateDustCanvas.height + 20) p.y = -20;
        gateDustCtx.fillStyle = `rgba(180, 160, 140, ${p.opacity})`;
        gateDustCtx.beginPath();
        gateDustCtx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
        gateDustCtx.fill();
      }
      gateDustRafId = requestAnimationFrame(animateGateDust);
    } else {
      gateDustRafId = 0; // stopped — will restart when gate reopens
    }
  }
  animateGateDust();

  gateEnter.addEventListener('click', () => {
    if (isActive) return;
    const isReturning = localStorage.getItem('stonepile-entered');
    gateEl.classList.add('hidden');
    localStorage.setItem('stonepile-entered', '1');
    ensureAudio(); // Unlock audio on first user gesture
    // Fetch environment state and start pulsing
    fetchEnvState().then(() => {
      if (!envState.dormant) sendPulse();
      // Recent activity shadow — a subtle flicker at the edge of vision
      if (envState.recent) {
        setTimeout(() => {
          const shadow = document.getElementById('vignette');
          shadow.style.boxShadow = 'inset 0 0 120px 40px rgba(200,160,110,0.08)';
          setTimeout(() => { shadow.style.boxShadow = ''; }, 2000);
        }, 1200);
      }
    });
    // Warmth overlay — the pile remembers you
    const savedWarmth = parseFloat(localStorage.getItem('stonepile-lastWarmth')) || 0;
    if (savedWarmth > 0.05) {
      const overlay = document.getElementById('warmth-overlay');
      overlay.style.opacity = Math.min(0.6, savedWarmth * 0.8);
      setTimeout(() => { overlay.style.opacity = '0'; }, 300);
      setTimeout(() => { overlay.classList.remove('warm'); }, 3300);
    }
    // Snapshot — show the pile as you last saw it, then wake up
    const snapData = localStorage.getItem('stonepile-snapshot');
    if (snapData) {
      const snapCanvas = document.getElementById('snapshot-canvas');
      snapCanvas.width = window.innerWidth;
      snapCanvas.height = window.innerHeight;
      const snapImg = new Image();
      snapImg.onload = () => {
        const sctx = snapCanvas.getContext('2d');
        sctx.drawImage(snapImg, 0, 0, snapCanvas.width, snapCanvas.height);
        snapCanvas.classList.add('flash');
        setTimeout(() => { snapCanvas.classList.remove('flash'); }, 1200);
      };
      snapImg.src = snapData;
    }
    setTimeout(() => {
      isActive = true;
      // Push state so browser back returns to the gate instead of leaving
      history.pushState({ spInPile: true }, '');
      inputBar.classList.add('visible');
      inputVisible = true;
      document.getElementById('stone-count').classList.add('show');
      document.getElementById('vignette').classList.add('show');
    }, 1000);
    if (!isDemo && !isReturning) {
      addStone('第一块', canvas.width * 0.35, groundY - 40, 0, 0.3, 0.02,
        '这里是石堆。一个没有账号、没有点赞、没有算法的地方。只有前人扔下的石头。每个人都可以留下自己的。双击任何石头可以阅读里面的内容。');
      setTimeout(() => {
        addStone('轻与重', canvas.width * 0.55, groundY - 90, 0.5, 0.2, -0.01,
          '石头有重量。内容越长、越沉，石头就越大越重。重的石头落在堆底，轻的浮在表面。用物理而不是算法来排序——这本身就是一种态度。');
        setTimeout(() => {
          addStone('路', canvas.width * 0.48, groundY - 150, -0.3, 0.4, 0.03,
            '你可以在石堆里拖拽任何石头。经常被走过的地面会磨得发亮，无人问津的角落会长满青苔。一切都在时间里变化，就像真实的世界。');
        }, 400);
      }, 400);
    }
  });

  // ── Keyboard accessibility: Enter/Space triggers click on button-like divs ──
  function addKeyTrigger(el) {
    el.addEventListener('keydown', function(e) {
      if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); el.click(); }
    });
  }
  addKeyTrigger(gateEnter);
  addKeyTrigger(gateStatsEl);
  addKeyTrigger(stoneCountEl);
  addKeyTrigger(document.getElementById('commons-toggle'));

  // ── Persistence ──
  const STORAGE_KEY = 'stonepile_v3';

  function saveStones() {
    // Never save mid-restock — a partial drop would truncate the pile
    if (restocking) return;
    const data = stones.map(s => ({
      text: s.text, content: s.content, weight: s.weight,
      x: s.body.position.x, y: s.body.position.y,
      angle: s.body.angle, vx: s.body.velocity.x, vy: s.body.velocity.y,
      av: s.body.angularVelocity, radius: s.radius,
      color: s.color, createdAt: s.createdAt, warmth: s.warmth || 0
    }));
    // Save moss grid (only cells with meaningful moss)
    const mossData = mossGrid.filter(c => c.mossLevel > 0.05 || (Date.now() - c.lastVisit) > 60000)
      .map(c => ({ gx: c.gx, gy: c.gy, lastVisit: c.lastVisit, mossLevel: c.mossLevel }));
    localStorage.setItem(STORAGE_KEY, JSON.stringify({
      v: 5, stones: data, wear: wearMarks.slice(-MAX_WEAR), count: stoneCount,
      moss: mossData, trail: trailMarks.slice(-MAX_TRAIL)
    }));
    // Remember the pile's warmth — on return, a warm glow greets you
    const avgWarmth = stones.length > 0
      ? stones.reduce((sum, s) => sum + (s.warmth || 0), 0) / stones.length
      : 0;
    localStorage.setItem('stonepile-lastWarmth', String(Math.min(avgWarmth, 0.75)));
  }

  function loadStones() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) return;
      const data = JSON.parse(raw);
      // Version check — warn on mismatch but try to load with best effort
      if (data.v !== 5) {
        console.warn('STONEPILE: saved data v' + data.v + ' (current v5), attempting load');
        if (!data.stones || !data.stones.length) return;
      }
      if (!data.stones || !data.stones.length) return;
      // Keep only the newest MAX_STONES
      const keep = data.stones.slice(-MAX_STONES);
      // Stones return ONE BY ONE — dropped all at once they crash into each
      // other and scatter. Sequentially, the pile re-forms gently from the
      // bottom up, the way it was built. Heaviest first: foundation stones.
      const sorted = keep.slice().sort((a, b) =>
        (b.weight || 0) - (a.weight || 0));
      restocking = true;
      sorted.forEach((s, i) => {
        setTimeout(() => {
          const weight = s.weight || computeWeight(s.content || s.text);
          const radius = computeRadius((s.text || '').length, weight);
          const body = createStoneBody(
            canvas.width / 2 + (Math.random() - 0.5) * canvas.width * 0.14,
            -60 - Math.random() * 50,
            radius, weight
          );
          const stone = {
            body, text: s.text, content: s.content || s.text, weight, radius,
            color: s.color, createdAt: s.createdAt || Date.now(), readAt: null,
            warmth: s.warmth || 0, chiselOffsets: null
          };
          stone.chiselOffsets = [];
          for (let j = 0; j < s.text.length; j++) {
            stone.chiselOffsets.push({ x: (Math.random() - 0.5) * 2, y: (Math.random() - 0.5) * 2 });
          }
          stones.push(stone);
          Composite.add(engine.world, body);
          stoneCount = stones.length;
          updateStoneCount();
          if (i === sorted.length - 1) {
            // Pile fully restocked — absorb any strays that slipped in
            restocking = false;
            cullOldStones();
            saveStones();
          }
        }, 400 + i * 170);
      });
      stoneCount = 0;
      wearMarks = data.wear || [];
      // Restore moss
      if (data.moss) {
        for (const mc of data.moss) {
          const cell = mossGrid.find(c => c.gx === mc.gx && c.gy === mc.gy);
          if (cell) { cell.lastVisit = mc.lastVisit; cell.mossLevel = mc.mossLevel; }
        }
      }
      trailMarks = data.trail || [];
      updateStoneCount();
    } catch (e) { console.warn('Failed to load stones'); }
  }

  setInterval(() => { if (isActive && stones.length) saveStones(); }, 3000);
  // Pulse heartbeat — tell the world "someone is here"
  setInterval(() => { if (isActive) sendPulse(); }, 120000); // every 2 min
  // Refresh environment state periodically
  setInterval(() => { if (isActive) fetchEnvState(); }, 300000); // every 5 min

  // ── Demo mode ──
  if (isDemo) {
    setTimeout(() => {
      gateEl.classList.add('hidden');
      setTimeout(() => {
        isActive = true;
        inputBar.classList.add('visible');
        inputVisible = true;
        document.getElementById('stone-count').classList.add('show');
        document.getElementById('vignette').classList.add('show');
        const demos = ['沉','念','光'];
        demos.forEach((t, i) => {
          setTimeout(() => {
            addStone(t, canvas.width*(0.35+i*0.2), 80+Math.random()*40, (Math.random()-0.5)*2, Math.random()*1.5, (Math.random()-0.5)*0.06);
          }, i*300);
        });
      }, 600);
    }, 300);
  }

  // ── Ancestor stones — first-time visitors find a pile that already has history ──
  // Seeded from the commons (real stones people offered) when reachable,
  // otherwise from the house stones below.

  async function seedAncestorStones() {
    let common = null;
    try {
      const res = await fetch(POOL_API + '/pool', { cache: 'no-store' });
      const data = await res.json();
      if (data && Array.isArray(data.stones) && data.stones.length) common = data.stones;
    } catch (e) { /* the commons is unreachable — the house stones remain */ }

    if (common) {
      // Take the newest few — leave room in the visitor's pile for their own
      const seeds = common.slice(-7);
      seeds.forEach((s, i) => {
        const x = canvas.width * (0.32 + i * 0.055) + (Math.random() - 0.5) * 40;
        const y = 60 + Math.random() * 40;
        // Pool data is untrusted — cap lengths, validate timestamp
        const st = String(s.t || '').trim().slice(0, 24);
        if (!st) return;
        const sc = String(s.c || st).slice(0, 2000);
        const sts = Number(s.ts);
        const stone = addStone(st, x, y, 0, 0, 0, sc);
        stone.createdAt = (sts > 946684800000 && sts < Date.now()) ? sts : Date.now();
      });
      saveStones();
      return;
    }

    const ancestors = [
      { text: '渡', content: '所有人问你飞得高不高，很少有人问你飞得累不累。沉的东西，都是自己扛的。', daysAgo: 22 },
      { text: '凌晨三点', content: '这个点醒着的人只有两种：还没睡的，和已经醒了的。但他们都看着同一片黑。', daysAgo: 19 },
      { text: '石头记', content: '把最重的话，留给最沉默的东西。这是我来这个网站的理由。', daysAgo: 15 },
      { text: '车站', content: '每次到站都不知道该往哪走。每条路看起来都一样，但走上去就不同了。', daysAgo: 12 },
      { text: '野', content: '风把话说完就停了。剩下的事，就是你自己的了。', daysAgo: 10 },
      { text: '归处', content: '走再远也是回到自己。这句话我花了十年才听懂。', daysAgo: 8 },
      { text: '拾', content: '你捡起的每块石头，都是别人放下的。你放下的时候，也知道会有人来捡。', daysAgo: 5 },
      { text: '一个想法', content: '我一直觉得互联网缺一个地方：没有评论区、没有点赞数、没有头像和个人简介。只是一个地方，让你知道别人来过。我觉得这就是那个地方。', daysAgo: 3 }
    ];
    ancestors.forEach((a, i) => {
      // Ancestors are the existing pile — they belong in the basin
      const x = canvas.width * (0.34 + i * 0.065) + (Math.random() - 0.5) * 40;
      const y = 60 + Math.random() * 40;
      const stone = addStone(a.text, x, y, 0, 0, 0, a.content);
      // Backdate — these stones have been lying here for days
      stone.createdAt = Date.now() - a.daysAgo * 86400000;
    });
    saveStones();
  }

  // ── Commons panel — the public pile, where offered stones gather ──
  const commonsToggle = document.getElementById('commons-toggle');
  const commonsPanel = document.getElementById('commons-panel');
  const commonsList = document.getElementById('commons-list');
  const commonsClose = commonsPanel.querySelector('.commons-close');
  let commonsFetched = false;

  function ageStr(ts) {
    const d = (Date.now() - ts) / 86400000;
    if (d < 1) return '几小时前';
    if (d < 2) return '1 天前';
    return Math.floor(d) + ' 天前';
  }

  async function fetchCommons() {
    commonsList.innerHTML = '<div class="commons-empty">寻找石头……</div>';
    let stones = null;
    try {
      const res = await fetch(POOL_API + '/pool', { cache: 'no-store' });
      const data = await res.json();
      if (data && Array.isArray(data.stones) && data.stones.length) stones = data.stones.slice(-20);
    } catch (e) { /* Commons unreachable — use built-in ancestors */ }

    if (!stones) {
      // House stones as fallback
      stones = [
        { t: '渡', c: '所有人问你飞得高不高，很少有人问你飞得累不累。', ts: Date.now() - 9 * 86400000 },
        { t: '夜航', c: '凌晨三点写下的东西，都是白天不敢说的。', ts: Date.now() - 7 * 86400000 },
        { t: '石头记', c: '把最重的话，留给最沉默的东西。', ts: Date.now() - 6 * 86400000 },
        { t: '归', c: '走再远，最后都是回到自己。', ts: Date.now() - 4 * 86400000 },
        { t: '野', c: '风把话说完，就停了。', ts: Date.now() - 3 * 86400000 },
        { t: '拾', c: '你捡起的每块石头，都是别人放下的。', ts: Date.now() - 2 * 86400000 }
      ];
    }

    commonsList.innerHTML = '';
    if (!stones.length) {
      commonsList.innerHTML = '<div class="commons-empty">公堆里还没有石头。把你觉得值得的，供上来。</div>';
      return;
    }
    stones.reverse().forEach(s => {
      const d = document.createElement('div');
      d.className = 'commons-stone';
      d.innerHTML =
        '<div class="cs-text">' + escapeHtml(String(s.t || '').trim().slice(0, 24)) + '</div>' +
        '<div class="cs-body">' + escapeHtml(String(s.c || s.t || '').slice(0, 200)) + '</div>' +
        '<div class="cs-age">' + ageStr(Number(s.ts) || Date.now()) + '</div>';
      commonsList.appendChild(d);
    });
  }

  commonsToggle.addEventListener('click', () => {
    commonsPanel.classList.add('open');
    pushOverlayState();
    if (!commonsFetched) { fetchCommons(); commonsFetched = true; }
  });
  commonsClose.addEventListener('click', () => { commonsPanel.classList.remove('open'); });
  commonsPanel.addEventListener('click', (e) => { if (e.target === commonsPanel) commonsPanel.classList.remove('open'); });

  // Keyboard close — Escape closes any open overlay
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') closeAllOverlays();
  });

  // Browser back button: closes overlays first, then returns to the gate
  // (home page), and only leaves the site when already at the gate.
  window.addEventListener('popstate', (e) => {
    if (hasOpenOverlay()) {
      closeAllOverlays();
      history.pushState({ spGuard: true }, '');
    } else if (isActive) {
      // Inside the pile — go back to the gate (home page).
      gateEl.style.display = '';
      gateEl.classList.remove('hidden');
      isActive = false;
      // Restart dust animation if it stopped
      if (gateDustRafId === 0) animateGateDust();
      history.pushState({ spAtGate: true }, '');
    }
  });

  // ── Startup ──
  // Mark the initial page load in history so popstate has a reference point.
  history.replaceState({ spRoot: true }, '');
  loadStones();
  // First visit: the pile should already have history (unless user cleared it before)
  if (stoneCount === 0 && !localStorage.getItem('stonepile-seeded')) {
    seedAncestorStones();
    localStorage.setItem('stonepile-seeded', '1');
  }
  // Rubble regenerates every visit — silent stones that make the pile a place
  // rather than a message board. They are never saved; they arrive fresh.
  generateRubble();
  // Received a rubbing (#s=...) — a stone someone shared lands in your pile
  if (location.hash.startsWith('#s=')) {
    try {
      const data = JSON.parse(decodeURIComponent(escape(atob(location.hash.slice(3)))));
      // Untrusted input — validate types and cap lengths before it touches the pile
      if (data && typeof data.t === 'string' && data.t.trim()) {
        const t = data.t.trim().slice(0, 24);
        const c = (typeof data.c === 'string' && data.c.trim() ? data.c : t).slice(0, 2000);
        const ts = Number(data.ts);
        const shared = addStone(t, canvas.width / 2 + (Math.random() - 0.5) * 100, 70, 0, 0.5, 0, c);
        shared.createdAt = (ts > 946684800000 && ts < Date.now()) ? ts : Date.now();
        shared.shared = true;             // mark as a received rubbing
        shared.highlightUntil = Date.now() + 4000; // glow for 4 seconds
        saveStones();
        // Brief toast — someone pointed you to this stone
        const toast = document.createElement('div');
        toast.style.cssText = 'position:fixed;bottom:120px;left:50%;transform:translateX(-50%);background:rgba(30,26,22,0.85);color:#D4C8B0;padding:10px 22px;border-radius:6px;font-size:13px;letter-spacing:1px;opacity:0;transition:opacity 0.6s;z-index:200;pointer-events:none;white-space:nowrap;';
        toast.textContent = '有人指了这块石头给你';
        document.body.appendChild(toast);
        requestAnimationFrame(() => { toast.style.opacity = '1'; });
        setTimeout(() => { toast.style.opacity = '0'; setTimeout(() => toast.remove(), 600); }, 3500);
      }
    } catch (e) { /* malformed hash — ignore silently */ }
    history.replaceState(null, '', location.pathname);
  }
  // Everyone sees the gate on every visit — the gate IS the home page.

  // ── Clear pile ──
  const stoneCountEl = document.getElementById('stone-count');
  const clearToast = document.getElementById('clear-toast');
  stoneCountEl.addEventListener('click', () => {
    if (stoneCount > 0) { clearToast.classList.add('show'); pushOverlayState(); }
  });
  document.getElementById('clear-no').addEventListener('click', () => clearToast.classList.remove('show'));
  document.getElementById('clear-yes').addEventListener('click', () => {
    for (const s of stones) Composite.remove(engine.world, s.body);
    stones = [];
    wearMarks = [];
    trailMarks = [];
    initMossGrid();
    groundCracks = [];
    generateGroundCracks();
    stoneCount = 0;
    updateStoneCount();
    localStorage.removeItem(STORAGE_KEY);
    clearToast.classList.remove('show');
  });

  // Run physics
  const runner = Runner.create();
  Runner.run(runner, engine);

  window.addEventListener('resize', () => {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
    gateDustCanvas.width = window.innerWidth;
    gateDustCanvas.height = window.innerHeight;
    initFrostCanvas();
    buildGround();           // rebuild physics bowl for new canvas size
    generateGroundCracks();
  });

  renderFrame();
  window.addEventListener('beforeunload', () => {
    saveStones();
    // Save a memory snapshot — the pile as you last saw it
    try {
      const snapCanvas = document.createElement('canvas');
      snapCanvas.width = Math.min(canvas.width, 400);
      snapCanvas.height = Math.min(canvas.height, 300);
      const snapCtx = snapCanvas.getContext('2d');
      snapCtx.drawImage(canvas, 0, 0, snapCanvas.width, snapCanvas.height);
      localStorage.setItem('stonepile-snapshot', snapCanvas.toDataURL('image/jpeg', 0.3));
    } catch (e) { /* localStorage full — skip */ }
  });
</script>
</body>
</html>
